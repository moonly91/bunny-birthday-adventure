<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bunny Birthday Adventure</title>
  <meta name="description" content="A cozy offline point-and-click game: help the bunnies prepare a surprise party for Lisa's 16th birthday on September 26th.">
  <meta name="theme-color" content="#ffb35c">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="title">
  <noscript><p class="noscript">Bunny Birthday Adventure needs JavaScript turned on. 🐰</p></noscript>

  <div id="app">
    <!-- ============ TITLE ============ -->
    <section id="title-screen" class="screen is-active" aria-labelledby="game-title">
      <div class="title-deco" id="title-deco" aria-hidden="true"></div>
      <div class="title-card">
        <div class="title-cal" aria-hidden="true"><span class="cal-top">SEPT</span><span class="cal-day">26</span><span class="cal-note">Lisa ♥ 16</span></div>
        <h1 id="game-title" class="game-title">
          <span class="t-emoji" aria-hidden="true">🐰</span>
          <span class="t-line t1">Bunny</span>
          <span class="t-line t2">Birthday</span>
          <span class="t-line t3">Adventure</span>
        </h1>
        <p class="tagline">A very important birthday mission…</p>
        <div class="title-hero" id="title-hero" aria-hidden="true"></div>
        <div class="title-actions">
          <button id="btn-continue" class="btn btn-primary btn-big" hidden>▶ CONTINUE</button>
          <button id="btn-start" class="btn btn-primary btn-big">START PARTY PREPARATIONS</button>
          <button id="btn-newgame" class="btn btn-ghost" hidden>Start a new game</button>
        </div>
        <p class="title-note">🎂 Lisa's 16th birthday is <b>tomorrow</b>!</p>
      </div>
      <p class="title-foot">Plays fully offline · Progress saves automatically · 🔊 Sound on</p>
    </section>

    <!-- ============ GAME ============ -->
    <section id="game" class="screen" aria-label="Bunny Birthday Adventure">
      <header id="hud">
        <div class="hud-left">
          <div class="carrot-pill" id="carrot-pill" role="status" aria-live="polite">
            <span class="carrot-ico" id="carrot-icon" aria-hidden="true"></span>
            <span class="lbl">Carrots:</span><b id="carrot-count">30</b>
          </div>
        </div>
        <div class="hud-center">
          <div class="hud-title"><span class="cake-emoji" aria-hidden="true">🎂</span> Lisa's Birthday <span class="dash">—</span> <b>Sept 26</b></div>
          <div class="hud-progress" id="hud-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Party preparation progress">
            <span class="lbl">Party Preparation</span>
            <div class="bar"><div class="fill" id="progress-fill"></div></div>
            <b id="progress-pct">0%</b>
          </div>
        </div>
        <div class="hud-right">
          <button class="icon-btn" id="btn-music" aria-label="Toggle music">🎵</button>
          <button class="icon-btn" id="btn-sound" aria-label="Toggle sound">🔊</button>
          <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙️</button>
        </div>
      </header>

      <button id="objective" class="objective">
        <span class="obj-spark" aria-hidden="true">✨</span>
        <span class="obj-label">Next:</span>
        <span id="objective-text" class="obj-text">Talk to Hazel</span>
        <span id="objective-go" class="obj-go">Go</span>
      </button>

      <div id="main">
        <div id="stage-wrap">
          <div id="stage" class="stage">
            <div id="scene" class="scene"></div>
            <div id="scene-ui"></div>
          </div>
          <div id="transition" class="transition" hidden aria-hidden="true">
            <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i><i class="blob b5"></i>
            <div class="tr-card"></div>
          </div>
          <div id="dialogue" class="dialogue" hidden role="dialog" aria-label="Conversation"></div>
          <div id="minigame" class="minigame" hidden></div>
        </div>

        <nav id="dock" aria-label="Game menu">
          <div class="loc-badge" id="loc-badge">🏠 Kitchen</div>
          <button class="dock-btn" data-panel="todo" aria-expanded="false" aria-controls="panel">
            <span class="d-ico" aria-hidden="true">☑</span><span class="d-lbl">TO-DO</span><span class="badge" id="todo-badge">9</span>
          </button>
          <button class="dock-btn" data-panel="inventory" aria-expanded="false" aria-controls="panel">
            <span class="d-ico" aria-hidden="true">🎒</span><span class="d-lbl">INVENTORY</span>
          </button>
          <button class="dock-btn" data-panel="map" aria-expanded="false" aria-controls="panel">
            <span class="d-ico" aria-hidden="true">📍</span><span class="d-lbl">MAP</span>
          </button>
        </nav>

        <div id="panel-scrim" class="panel-scrim" hidden></div>
        <aside id="panel" class="panel" hidden aria-labelledby="panel-title">
          <div class="panel-head">
            <h2 id="panel-title">Panel</h2>
            <button id="panel-close" class="icon-btn small" aria-label="Close panel">✕</button>
          </div>
          <div id="panel-body" class="panel-body"></div>
        </aside>
      </div>
    </section>

    <!-- ============ FINALE ============ -->
    <section id="finale" class="screen" aria-label="The surprise party"></section>
  </div>

  <div id="modal-root"></div>
  <div id="fx-layer" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toasts" aria-live="polite"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/garden.js"></script>
  <script src="js/party.js"></script>
  <script src="js/cake.js"></script>
  <script src="js/muffins.js"></script>
  <script src="js/finale.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
